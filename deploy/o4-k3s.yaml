apiVersion: v1
kind: Namespace
metadata:
  name: lab3-o4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrolld
  namespace: lab3-o4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enrolld-o4
  template:
    metadata:
      labels:
        app: enrolld-o4
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: enrolld
          image: localhost/enrolld:o4
          imagePullPolicy: Never
          args: ["-addr", "0.0.0.0:8081", "-data", "/data", "-warmup", "60s", "-work", "1000000"]
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            successThreshold: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: enrolld
  namespace: lab3-o4
spec:
  type: NodePort
  selector:
    app: enrolld-o4
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enrolld
  namespace: lab3-o4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enrolld
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
